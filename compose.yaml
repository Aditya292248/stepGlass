# Local development services. App services are added as they land.
name: stepglass

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stepglass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stepglass}
      POSTGRES_DB: ${POSTGRES_DB:-stepglass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
