name: Bug report
description: Something isn't working as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API / ingestion
        - Worker / checks / summaries
        - Web UI
        - MCP server
        - SDK
        - Connector
        - Scenario / demo
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main @ 1a2b3c4
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, Docker version, MCP client (Claude Desktop, claude.ai, ChatGPT…).
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before pasting.
      render: shell
